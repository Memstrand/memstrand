name: CI

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # kuzu==0.11.3 (the `kuzu` / `all` extra, pinned in pyproject.toml)
      # ships cp313 wheels for both macOS (arm64 + x86_64) and manylinux
      # (2_28, aarch64 + x86_64), so every cell in this matrix can install
      # the full `[dev,all]` extra set — no more 3.13 special-case.
      - name: Install
        run: pip install -e '.[dev,all]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # Guard against ambient-environment leakage (e.g. a runner/shell
      # exporting MEMSTRAND_TOKEN or an HTTPS_PROXY) regressing test
      # hermeticity (see tests/conftest.py). Only needs to run once, not
      # once per matrix cell.
      - name: Test (hermeticity check — junk env must not leak in)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -q
        env:
          MEMSTRAND_TOKEN: junk
          MEMSTRAND_PORT: "1"
          HTTPS_PROXY: http://127.0.0.1:9

  # Real-process integration suite (tests/integration): spawns real
  # `memstrand serve`/CLI/`mcp_server` subprocesses and binds real sockets
  # (a stub OpenAI-compatible server) instead of mocking the process
  # boundary — see tests/integration/__init__.py. `timeout-minutes` is a
  # safety margin for a job made of subprocess-heavy, real-wire tests
  # rather than a hard expectation of actually taking that long locally
  # (~1 minute).
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev,all]'

      - name: Integration tests
        run: |
          if [ -d tests/integration ]; then
            pytest -q tests/integration
          else
            echo "tests/integration not present yet — skipping"
          fi

  build:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*
