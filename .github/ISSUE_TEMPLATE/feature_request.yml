name: Feature request
description: Suggest an idea for memstrand
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Check the README's Roadmap and
        [existing discussions](https://github.com/memstrand/memstrand/discussions)
        first in case it's already planned or being discussed.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that memstrand doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API, CLI flag, config var, or behavior you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related issues, or anything else that helps explain the request
