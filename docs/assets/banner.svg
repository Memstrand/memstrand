<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="memstrand: local-first memory for AI agents">
  <style>
    .wordmark { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 86px; fill: #16202b; }
    .tagline { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 24px; fill: #4b5a68; }
    .strand-a { stroke: #2f81f7; }
    .strand-b { stroke: #e3693c; }
    .rung { stroke: #9aa7b3; }
    .node-a { fill: #2f81f7; }
    .node-b { fill: #e3693c; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #f2f5f8; }
      .tagline { fill: #aab6c2; }
      .rung { stroke: #5b6773; }
    }
  </style>

  <!-- double helix: two strands (facts + relationships) with base-pair rungs -->
  <g transform="translate(60, 40)" fill="none" stroke-width="5" stroke-linecap="round">
    <path class="strand-a" d="M 20 0 C 90 55, 90 85, 20 120 C -50 155, -50 185, 20 240" />
    <path class="strand-b" d="M 20 0 C -50 55, -50 85, 20 120 C 90 155, 90 185, 20 240" />

    <!-- base-pair rungs -->
    <g class="rung" stroke-width="4">
      <line x1="-13" y1="14" x2="53" y2="14" />
      <line x1="-27" y1="40" x2="67" y2="40" />
      <line x1="-13" y1="66" x2="53" y2="66" />
      <line x1="13" y1="92" x2="27" y2="92" />
      <line x1="-13" y1="118" x2="53" y2="118" />
      <line x1="-27" y1="144" x2="67" y2="144" />
      <line x1="-13" y1="170" x2="53" y2="170" />
      <line x1="13" y1="196" x2="27" y2="196" />
      <line x1="-13" y1="222" x2="53" y2="222" />
    </g>

    <!-- nodes: facts (blue) -->
    <g class="node-a">
      <circle cx="20" cy="0" r="7" />
      <circle cx="59" cy="38" r="7" />
      <circle cx="20" cy="66" r="7" />
      <circle cx="-23" cy="104" r="7" />
      <circle cx="20" cy="118" r="7" />
      <circle cx="-23" cy="150" r="7" />
      <circle cx="20" cy="170" r="7" />
      <circle cx="-14" cy="206" r="7" />
      <circle cx="20" cy="240" r="7" />
    </g>

    <!-- nodes: relationships (orange) -->
    <g class="node-b">
      <circle cx="20" cy="0" r="7" />
      <circle cx="-19" cy="38" r="7" />
      <circle cx="20" cy="66" r="7" />
      <circle cx="59" cy="104" r="7" />
      <circle cx="20" cy="118" r="7" />
      <circle cx="59" cy="150" r="7" />
      <circle cx="20" cy="170" r="7" />
      <circle cx="54" cy="206" r="7" />
      <circle cx="20" cy="240" r="7" />
    </g>
  </g>

  <text x="180" y="165" class="wordmark">memstrand</text>
  <text x="182" y="210" class="tagline">Local-first memory for AI agents. Typed, scoped, never leaked.</text>
</svg>
