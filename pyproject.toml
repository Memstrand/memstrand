[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memstrand"
version = "0.2.2"
description = "Local-first typed memory for AI agents. Zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chiran" }]
keywords = [
    "ai",
    "agents",
    "agent-memory",
    "memory",
    "long-term-memory",
    "second-brain",
    "rag",
    "knowledge-graph",
    "vector-search",
    "local-first",
    "local-llm",
    "ollama",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "obsidian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.12",         # mcp>=2 requires pydantic>=2.12.0 itself
    "qdrant-client>=1.10",
    "fastembed>=0.4",         # local ONNX embeddings, no torch, no API key; 0.4.0 is the first release with fastembed.rerank.cross_encoder (used by Reranker)
    "httpx>=0.27",            # OpenAI-compatible local LLM endpoint
    "mcp>=2,<3",                 # MCP server (v2 MCPServer API); 2.0.0 already has MCPServer, streamable_http_app(host=...), and mcp.server.mcpserver.exceptions.ToolError
    "pyyaml>=6.0",
    "starlette>=0.37",        # server.py builds the ASGI app directly (today only a transitive dep of mcp)
    "uvicorn>=0.31.1",        # server.py runs uvicorn directly; mcp>=2 requires uvicorn>=0.31.1 itself
]

[project.optional-dependencies]
# pinned: upstream archived after Oct 2025 acquisition (MIT); sqlite is the
# default graph backend. kuzu 0.11.3 ships cp313 wheels (macOS arm64/x86_64,
# manylinux_2_28) but no cp314 wheels, and its sdist doesn't build on 3.14 —
# so on 3.14 the `kuzu`/`all` extra is simply unavailable rather than trying
# (and failing) to build from source.
kuzu = ["kuzu==0.11.3; python_version < \"3.14\""]
pdf = ["pypdf>=4.0"]         # PDF ingestion
all = ["memstrand[kuzu,pdf]"]
dev = ["pytest>=8.0", "ruff>=0.17,<0.18"]

[project.scripts]
memstrand = "memstrand.cli:main"

[project.urls]
Homepage = "https://github.com/memstrand/memstrand"
Repository = "https://github.com/memstrand/memstrand"
Source = "https://github.com/memstrand/memstrand"
Documentation = "https://github.com/memstrand/memstrand/tree/master/docs"
Issues = "https://github.com/memstrand/memstrand/issues"
Changelog = "https://github.com/memstrand/memstrand/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memstrand"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: real-process tests (tests/integration) that spawn subprocesses and bind real sockets; see tests/integration/conftest.py for the collection gate that keeps these out of a bare `pytest -q`",
]
