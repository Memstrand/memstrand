[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memstrand"
version = "0.2.1"
description = "Local-first typed memory for AI agents. Zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chiran" }]
keywords = [
    "ai",
    "agents",
    "agent-memory",
    "memory",
    "long-term-memory",
    "second-brain",
    "rag",
    "knowledge-graph",
    "vector-search",
    "local-first",
    "local-llm",
    "ollama",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "obsidian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "qdrant-client>=1.10",
    "fastembed>=0.3",         # local ONNX embeddings, no torch, no API key
    "httpx>=0.27",            # OpenAI-compatible local LLM endpoint
    "mcp>=2,<3",                 # MCP server (v2 MCPServer API)
    "pyyaml>=6.0",
    "starlette>=0.37",        # server.py builds the ASGI app directly (today only a transitive dep of mcp)
    "uvicorn>=0.30",          # server.py runs uvicorn directly (today only a transitive dep of mcp)
]

[project.optional-dependencies]
kuzu = ["kuzu==0.11.3"]      # pinned: upstream archived after Oct 2025 acquisition (MIT); sqlite is the default graph backend
pdf = ["pypdf>=4.0"]         # PDF ingestion
all = ["memstrand[kuzu,pdf]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
memstrand = "memstrand.cli:main"

[project.urls]
Homepage = "https://github.com/memstrand/memstrand"
Repository = "https://github.com/memstrand/memstrand"
Source = "https://github.com/memstrand/memstrand"
Documentation = "https://github.com/memstrand/memstrand/tree/master/docs"
Issues = "https://github.com/memstrand/memstrand/issues"
Changelog = "https://github.com/memstrand/memstrand/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memstrand"]

[tool.ruff]
target-version = "py311"
