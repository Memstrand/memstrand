[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memstrand"
version = "0.1.1"
description = "Local-first typed memory for AI agents. Zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chiran" }]
keywords = ["ai", "agents", "memory", "rag", "knowledge-graph", "local-first"]
dependencies = [
    "pydantic>=2.0",
    "qdrant-client>=1.10",
    "kuzu==0.11.3",          # pinned: upstream archived after Oct 2025 acquisition (MIT)
    "fastembed>=0.3",         # local ONNX embeddings, no torch, no API key
    "httpx>=0.27",            # OpenAI-compatible local LLM endpoint
    "mcp>=1.0",               # MCP server
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
memstrand = "memstrand.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memstrand"]

[tool.ruff]
target-version = "py311"
