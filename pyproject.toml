[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memstrand"
version = "0.2.0"
description = "Local-first typed memory for AI agents. Zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chiran" }]
keywords = ["ai", "agents", "memory", "rag", "knowledge-graph", "local-first"]
dependencies = [
    "pydantic>=2.0",
    "qdrant-client>=1.10",
    "fastembed>=0.3",         # local ONNX embeddings, no torch, no API key
    "httpx>=0.27",            # OpenAI-compatible local LLM endpoint
    "mcp>=1.0,<2",            # MCP server; mcp 2.x removes FastMCP, which the server depends on
    "pyyaml>=6.0",
    "starlette>=0.37",        # server.py builds the ASGI app directly (today only a transitive dep of mcp)
    "uvicorn>=0.30",          # server.py runs uvicorn directly (today only a transitive dep of mcp)
]

[project.optional-dependencies]
kuzu = ["kuzu==0.11.3"]      # pinned: upstream archived after Oct 2025 acquisition (MIT); sqlite is the default graph backend
pdf = ["pypdf>=4.0"]         # PDF ingestion
all = ["memstrand[kuzu,pdf]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
memstrand = "memstrand.cli:main"

[project.urls]
Homepage = "https://github.com/chiranjeevirajukr/memstrand"
Repository = "https://github.com/chiranjeevirajukr/memstrand"
Source = "https://github.com/chiranjeevirajukr/memstrand"

[tool.hatch.build.targets.wheel]
packages = ["src/memstrand"]

[tool.ruff]
target-version = "py311"
