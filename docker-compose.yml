# memstrand infra: only Qdrant needs a container.
# Kuzu (graph) and SQLite (provenance/sessions) are embedded — zero setup.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
